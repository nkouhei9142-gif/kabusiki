<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>株マスターへの道</title>
<style>
:root{color-scheme:light;--bg:#fff7d6;--ink:#2b2350;--pink:#ff5fa2;--blue:#3ba3ff;--green:#22c58b;--red:#ff5d5d;--yel:#ffd23f;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:700}
#app{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:14px 16px;margin:12px 0}
h1{font-size:30px;margin:8px 0;text-align:center}h2{font-size:21px;margin:0 0 6px}
.btn{display:block;width:100%;font:inherit;font-size:20px;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px;margin:16px 0 4px;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bar{display:flex;gap:8px;position:sticky;top:0;z-index:5;padding:8px 0;background:var(--bg)}
.pill{flex:1;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 8px;text-align:center;font-size:12px}
.pill b{display:block;font-size:19px}.pill.t{background:var(--yel)}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0}.dots i{width:30px;height:10px;border-radius:6px;background:#ddd;border:2px solid var(--ink)}.dots i.on{background:var(--pink)}.dots i.done{background:var(--green)}
.news{background:var(--blue);color:#fff}.news .tag{display:inline-block;background:#fff;color:var(--ink);border-radius:20px;padding:2px 10px;font-size:13px}
.news p{font-size:19px;margin:8px 0 2px;line-height:1.5}
.st{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.nm{font-size:19px}.sub{font-size:12px;opacity:.7;font-weight:600}.pr{font-size:22px;text-align:right}
.ctl{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.ctl button{width:54px;height:54px;font:inherit;font-size:28px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--green);color:#fff}
.ctl button.m{background:var(--red)}.ctl button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ctl span{min-width:70px;text-align:center;font-size:15px}.ctl span b{font-size:24px}
.up{color:var(--red)}.down{color:var(--blue)}
.chip{display:inline-block;background:var(--yel);border:2px solid var(--ink);border-radius:12px;padding:2px 10px;font-size:14px;margin:2px 4px 2px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:2px dashed #ddd}
.big{font-size:44px;text-align:center;margin:4px 0}.small{font-size:12px;opacity:.7;font-weight:600;line-height:1.5}
.bars{height:14px;background:#eee;border-radius:8px;overflow:hidden;border:2px solid var(--ink)}.bars i{display:block;height:100%}
.lead{font-size:18px;line-height:1.7}
.nl{font-size:17px;line-height:1.5;margin:8px 0 2px}.nl div{margin:6px 0}</style></head><body><div id="app"></div>
<script>
const S=[
{id:'nin',name:'任天堂',e:'🎮',type:'成長型',n:12,p:2000,div:20,desc:'ゲーム機・ソフトを世界へ販売',c:'#ff5d5d'},
{id:'toy',name:'トヨタ自動車',e:'🚗',type:'景気に敏感',n:150,p:3000,div:50,desc:'車を世界で販売。輸出が多い',c:'#3ba3ff'},
{id:'kan',name:'関西電力',e:'💡',type:'安定型',n:9,p:1500,div:60,desc:'生活に欠かせない電気を供給',c:'#ffb800'},
{id:'ana',name:'ANAホールディングス',e:'✈️',type:'ハイリスク型',n:3,p:2500,div:0,desc:'旅行・出張の需要で業績が動く',c:'#8a63ff'}];
const R=[
{q:'1年目 前半',tag:'📺 新製品',news:['👍 新型ゲーム機の発売が発表され、予約が殺到している。','⚠️ ただし、半導体（部品）が不足し、生産が遅れる可能性がある。','❓ 「電気代がまた上がるらしい」とSNSで話題（根拠は不明）。'],ch:[6,-4,1,0],rs:['新型機への期待で買いが入ったが、部品不足の不安で上昇は小幅に。','半導体の不足で車の生産が遅れるとの見方から、売りが優勢に。','うわさには根拠がなく、ほぼ横ばい。','目立った材料がなく、横ばい。'],term:'複合的なニュース',why:'ニュースには良い話と悪い話が混ざることが多く、「全体でどちらが強いか」を考えるのが大切です。根拠のないうわさ（❓）に振り回されないようにしよう。'},
{q:'1年目 後半',tag:'💴 為替・原油',news:['👍 円安が進み、海外で稼いだお金の円換算が増えた。','⚠️ 原油価格が上昇し、燃料の輸入コストが高くなった。','👍 海外旅行の需要が回復し始めた。'],ch:[3,9,-6,-3],rs:['円安で海外売上が円換算で増えたが、部品高も重なり小幅な上昇に。','円安で輸出の利益が膨らむ期待から、買いが集まった。','原油高で発電の燃料費が増え、利益が減る懸念から売られた。','旅行需要の回復は好材料だが、燃料費の増加で相殺されて小幅下落。'],term:'為替と業績',why:'同じ円安・原油高でも、事業によって「得する会社」と「損する会社」に分かれます。',div:true},
{q:'2年目 前半',tag:'🌸 連休',news:['👍 大型連休で国内旅行客が急増し、空港も新幹線も満席。','⚠️ 航空各社は、燃料費の負担が増えると発表した。','👍 政府が電気料金の補助金の延長を決めた。'],ch:[0,-2,3,4],rs:['関連ニュースがなく、様子見で動かず。','目立つ好材料がなく、円安の効果も一服して小幅安。','補助金の延長で電力需要が安定し、配当を維持できるとの安心感から買われた。','旅客の増加は好材料だが、燃料費の負担増で上昇は限定的。'],term:'業績予想',why:'好材料と悪材料が同時に出ると、差し引きで株価が決まります。補助金のような「安定」を生むニュースは、安定型の株に効きます。'},
{q:'2年目 後半',tag:'🏆 決算',news:['👍 任天堂が「過去最高益」を発表！','⚠️ ただし、来期の見通しは市場の予想を下回った。','⚠️ トヨタが、新型EVの発売延期を発表した。'],ch:[-9,-7,0,2],rs:['最高益でも来期の見通しが期待より弱く、失望売りが出た。','EVの発売延期で、将来の成長への期待が下がった。','ニュースの影響を受けにくく、動かず。','連休の旅行需要が続き、小幅に上昇。'],term:'織り込み済み',why:'好決算でも「見通し」が期待に届かないと下落します。すでに値上がりして期待が株価に入っていると、これを「織り込み済み」といいます。株価は今の利益より、将来への期待で動きます。'},
{q:'3年目 前半',tag:'⚠️ ショック',news:['⚠️ 海外で感染症が拡大。国をまたぐ移動が制限され、工場も止まった。','👍 政府が大型の景気対策を発表した。','👍 家で過ごす時間が増え、家庭向けの娯楽の需要が高まった。'],ch:[6,-8,-1,-22],rs:['巣ごもりでゲーム需要が増え、景気対策への期待も追い風に。','工場停止と移動制限で生産・販売が落ち、景気対策では補えないとの見方に。','工場の稼働が減って電力需要が少し減ったが、生活インフラなので下落は小幅。','移動制限で旅客が激減し、景気対策があっても大きく売られた。'],term:'リスクと分散投資',why:'予想できない出来事の影響は、会社ごとにバラバラです。複数の会社に分けて持つと、被害が小さくなります。',div:true},
{q:'3年目 後半',tag:'💉 回復',news:['👍 ワクチンが普及し、人の移動が回復し始めた。','⚠️ 物価が上がり、消費者は買い物に慎重になっている。','❓ 「任天堂の新作ソフトが不振らしい」との報道（確認はされていない）。'],ch:[-3,6,0,16],rs:['新作不振の報道が未確認のまま広まり、念のため売る人が増えた。','移動の回復で販売が戻る期待があるが、物価高で上昇は控えめ。','需要・コストとも大きな変化がなく、動かず。','人の移動が戻り、業績の回復を見込んだ買いが集まった。'],term:'長期投資とうわさ',why:'下落した株も、業績が戻る期待で回復しました。未確認のうわさに反応して売ると、判断を誤ることがあります。'}];
const DIV=[1,4]; // 決算ラウンド(0始まり)
let st,y0=0;
const $=document.getElementById('app'),yen=n=>'¥'+Math.round(n).toLocaleString();
const val=()=>S.reduce((a,s,i)=>a+st.h[s.id]*st.p[i],0),tot=()=>st.cash+val();
const cap=i=>{const v=st.p[i]*S[i].n;return '約'+(v>=10000?(v/10000).toFixed(1)+'兆円':Math.round(v).toLocaleString()+'億円')};
function init(){st={r:0,cash:100000,h:{nin:0,toy:0,kan:0,ana:0},p:S.map(s=>s.p),hist:S.map(s=>[s.p]),tops:[],divT:0,last:null,start:100000}}
function draw(h){const y=scrollY;$.innerHTML=h;scrollTo(0,y)}
function bar(){return `<div class="dots">${R.map((_,i)=>`<i class="${i<st.r?'done':i==st.r?'on':''}"></i>`).join('')}</div>
<div class="bar"><div class="pill">💰現金<b>${yen(st.cash)}</b></div><div class="pill">📈株の価値<b>${yen(val())}</b></div><div class="pill t">⭐総資産<b>${yen(tot())}</b></div></div>`}
function spark(i){const h=st.hist[i],mn=Math.min(...h),mx=Math.max(...h),w=90,ht=30;
const pts=h.map((v,k)=>`${h.length>1?k*w/(h.length-1):0},${mx==mn?15:ht-(v-mn)/(mx-mn)*ht}`).join(' ');
return `<svg width="${w}" height="${ht+4}" viewBox="0 -2 ${w} ${ht+4}"><polyline points="${pts}" fill="none" stroke="${S[i].c}" stroke-width="3" stroke-linecap="round"/></svg>`}
function intro(n){
const H=k=>`<h1>📈 株マスターへの道</h1><div class="small" style="text-align:center">ガイダンス ${k}/6</div>`;
const defs='<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b2350"/></marker></defs>';
const box=(x,c,e,t)=>`<rect x="${x}" y="48" width="96" height="76" rx="16" fill="${c}" stroke="#2b2350" stroke-width="3"/><text x="${x+48}" y="82" text-anchor="middle" font-size="28">${e}</text><text x="${x+48}" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2350">${t}</text>`;
const ln=(x1,x2,y)=>`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#2b2350" stroke-width="3" marker-end="url(#ah)"/>`;
const tx=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2350">${t}</text>`;
let sq='';for(let i=0;i<24;i++)sq+=`<rect x="${8+(i%12)*27}" y="${30+Math.floor(i/12)*27}" width="22" height="22" rx="5" fill="${i==13?'#ff5fa2':'#ffd23f'}" stroke="#2b2350" stroke-width="2"/>`;
const mini=(e,t,s)=>`<div style="background:#fff3c4;border:3px solid var(--ink);border-radius:16px;padding:10px 4px"><div style="font-size:34px">${e}</div><b>${t}</b><div class="small">${s}</div></div>`;
const vs=(bg,a,as,b,bs,ic,t,cl)=>`<div style="display:flex;align-items:center;justify-content:space-between;background:${bg};border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:10px 0"><div><div style="font-size:24px">${a}</div><div class="small">${as}</div></div><div style="font-size:26px">＞</div><div><div style="font-size:24px">${b}</div><div class="small">${bs}</div></div><div style="font-size:30px;text-align:center">${ic}<div class="small ${cl}">${t}</div></div></div>`;
const fl=(e,t,c)=>`<div style="flex:1;background:${c};border:3px solid var(--ink);border-radius:14px;padding:8px 2px;text-align:center"><div style="font-size:26px">${e}</div><div style="font-size:12px">${t}</div></div>`;
const ar='<div style="font-size:18px">▶</div>';
const P=[
`${H(1)}<div class="card"><h2>① 株式会社ってなに？</h2>
<svg viewBox="0 0 340 170" width="100%">${defs}${box(8,'#ffd23f','🏭','会社')}${box(236,'#bfe3ff','👥','出資者')}${ln(108,230,70)}${tx(170,60,'📄 株を渡す')}${ln(230,108,104)}${tx(170,128,'💰 お金が入る')}${tx(170,156,'返さなくてOK！')}</svg>
<p class="lead">会社は<b>「株」</b>を発行して、たくさんの人からお金を集めます。お金を出した人は<b>株主</b>になります。</p></div>`,
`${H(2)}<div class="card"><h2>② 株の「全体の数」は会社ごとに違う</h2>
<svg viewBox="0 0 340 110" width="100%">${tx(170,18,'会社が発行した株ぜんぶ ＝ 発行済株式数')}${sq}${tx(54,96,'▲ あなたが買う1株')}</svg>
${S.map(s=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${s.e} ${s.name}</span><span>約${s.n}億株</span></div><div class="bars"><i style="width:${Math.max(3,s.n/150*100)}%;background:${s.c}"></i></div></div>`).join('')}
<p class="lead" style="margin-bottom:4px">株を持つ割合だけ、会社の持ち主です。<br><span class="chip">時価総額＝株価×発行済株式数</span>（会社の値段）</p>
<p class="small">※株数は概数、株価はゲーム用に簡略化しています。</p></div>`,
`${H(3)}<div class="card"><h2>③ 株主になると？</h2>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">${mini('📈','値上がり益','安く買って高く売る')}${mini('💴','配当','利益の一部をもらう')}${mini('🗳️','議決権','株主総会で投票')}</div>
<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0;font-size:16px"><span class="chip">1,000円で買う</span>▶<span class="chip">1,200円で売る</span>▶<b class="up">+200円！</b></div>
<p class="lead">⚠️ 会社がつぶれても、損するのは<b>出したお金まで</b>（有限責任）。</p></div>`,
`${H(4)}<div class="card"><h2>④ 株価はどう決まる？</h2>
${vs('#ffe3ee','🙋🙋🙋🙋','買いたい人 多い','🙋','売りたい人 少ない','📈','値上がり','up')}
${vs('#dff0ff','🙋','買いたい人 少ない','🙋🙋🙋🙋','売りたい人 多い','📉','値下がり','down')}
<p class="lead">株価は<b>需要（買いたい）と供給（売りたい）</b>のバランスで決まります。ニュースは、みんなの気持ちを動かします。</p></div>`,
`${H(5)}<div class="card"><h2>⑤ ニュースや出来事で株価は動く</h2>
<div style="display:flex;align-items:center;gap:4px">${fl('🌍','世の中の出来事','#d6f7e8')}${ar}${fl('📰','ニュース','#bfe3ff')}${ar}${fl('🙋','買う人・売る人が変わる','#ffd9e8')}${ar}${fl('📊','株価が動く','#fff3c4')}</div>
<div style="margin-top:10px">
<div class="row"><span>💴 円安</span><span>🚗 輸出の多い会社に追い風 <b class="up">▲</b></span></div>
<div class="row"><span>🛢️ 原油高</span><span>✈️ 燃料費が増える会社に逆風 <b class="down">▼</b></span></div>
<div class="row"><span>🏆 好決算</span><span>期待を超えれば <b class="up">▲</b>　超えなければ <b class="down">▼</b></span></div>
<div class="row"><span>🌀 感染症・災害</span><span>逆風の会社も、追い風の会社もある</span></div></div>
<p class="lead" style="margin-bottom:4px">世の中の出来事は、会社の<b>将来の利益の予想</b>を変えます。同じ出来事でも、会社によって影響は逆になることも。良い話と悪い話が混ざったり、根拠のないうわさ（❓）が出たりもするよ。</p></div>`,
`${H(6)}<div class="card"><h2>⑥ ゲームのルール</h2>
<div style="display:flex;align-items:center;gap:4px">${fl('📰','ニュースを読む','#bfe3ff')}${ar}${fl('🛒','売買する','#ffd9e8')}${ar}${fl('📊','株価が動く','#fff3c4')}${ar}${fl('💡','解説','#d6f7e8')}</div>
<p class="lead" style="margin-top:12px">所持金は<b>10万円</b>。全<b>6ラウンド</b>（3年分）。1株ずつ売買できるよ。</p>
<p class="small">※実際の投資は自己責任です。このゲームは投資の助言ではありません。</p></div>`];
draw(P[n]+`<button class="btn" onclick="${n<5?`intro(${n+1})`:'trade()'}">${n<5?'つぎへ ▶':'ゲームスタート！🚀'}</button>`+(n>0?`<button class="btn" style="background:#9aa;font-size:15px;padding:8px" onclick="intro(${n-1})">◀ もどる</button>`:''))}
function trade(){const r=R[st.r];
draw(bar()+`<div class="card news"><span class="tag">${r.tag}</span> <span class="tag">${r.q}</span><div class="nl">${r.news.map(t=>`<div>${t}</div>`).join('')}</div></div>
<div class="small" style="text-align:center">👍好材料　⚠️悪材料　❓うわさ（未確認）<br>良い話と悪い話が混ざっているよ。全体でどうなるか考えて売買しよう</div>`+
S.map((s,i)=>`<div class="card st"><div><div class="nm">${s.e} ${s.name}</div><div class="sub"><span class="chip" style="background:${s.c};color:#fff">${s.type}</span>${s.desc}</div><div class="sub">発行済株式数：約${s.n}億株　時価総額：${cap(i)}</div><div class="sub">配当：${s.div?'1株 '+s.div+'円（決算時）':'なし'}</div></div>
<div class="pr">${yen(st.p[i])}<br>${spark(i)}</div>
<div class="sub">持っている株：${st.h[s.id]}株</div>
<div class="ctl"><button class="m" onclick="tr(${i},-1)">−</button><span><b>${st.h[s.id]}</b>株</span><button onclick="tr(${i},1)">＋</button></div></div>`).join('')+
`<button class="btn" onclick="go()">決定！株価を見る 👀</button>`)}
function tr(i,d){const s=S[i];if(d>0){if(st.cash<st.p[i])return;st.cash-=st.p[i];st.h[s.id]++}else{if(!st.h[s.id])return;st.cash+=st.p[i];st.h[s.id]--}trade()}
function go(){const r=R[st.r],v=val();
st.tops.push(v>0?Math.max(...S.map((s,i)=>st.h[s.id]*st.p[i]))/v:0);
const before=[...st.p],tb=tot();
st.p=st.p.map((p,i)=>Math.max(100,Math.round(p*(1+r.ch[i]/100)/10)*10));
st.p.forEach((p,i)=>st.hist[i].push(p));
let dv=0;if(DIV.includes(st.r)){S.forEach(s=>dv+=s.div*st.h[s.id]);st.cash+=dv;st.divT+=dv}
st.last={before,tb,dv};result()}
function result(){const r=R[st.r],L=st.last,ta=tot(),d=ta-L.tb;
draw(bar()+`<div class="card"><h2>📊 株価が動いた！</h2>`+S.map((s,i)=>{const c=(st.p[i]/L.before[i]-1)*100;
return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${s.e} ${s.name}</span><span class="${c>0?'up':c<0?'down':''}">${yen(L.before[i])} → ${yen(st.p[i])}　${c>0?'▲+':c<0?'▼':''}${c.toFixed(0)}%</span></div><div class="small">▶ ${r.rs[i]}</div></div>`}).join('')+
`<p class="small">🔴赤＝上昇　🔵青＝下落（日本の株価表示と同じ）</p></div>
<div class="card" style="background:#e9fff4"><h2>💡 なぜ？ <span class="chip">${r.term}</span></h2><p class="lead">${r.why}</p></div>
${L.dv?`<div class="card" style="background:#fff3c4"><h2>💴 決算！配当金 ${yen(L.dv)} を受け取った</h2><p class="small">配当は株を「持っている」株主がもらえます。持っていなければ0円。（ゲーム用に多め設定）</p></div>`:''}
<div class="card"><div class="row"><span>このラウンドの資産の増減</span><b class="${d>0?'up':d<0?'down':''}">${d>=0?'+':''}${yen(d)}</b></div></div>
<button class="btn" onclick="nx()">${st.r<R.length-1?'つぎのラウンドへ ▶':'最終結果を見る 🏁'}</button>`)}
function nx(){st.r++;st.r>=R.length?end():trade()}
function end(){const ta=tot(),pr=ta-st.start,pc=pr/st.start*100,held=S.filter(s=>st.h[s.id]>0).length;
const avgTop=st.tops.reduce((a,b)=>a+b,0)/st.tops.length;
const single=S.map((s,i)=>{const sh=st.start/s.p,dv=sh*s.div*2;return {s,v:sh*st.p[i]+dv}});
const mx=Math.max(...single.map(x=>x.v),ta);
const rank=pc>=15?['🏆','株マスター！']:pc>=6?['🥇','投資の達人']:pc>=0?['🥈','堅実投資家']:['🌱','これから成長！'];
const badges=[avgTop<=0.6&&avgTop>0?'🧺 分散投資バッジ':'',st.divT>0?'💴 配当ゲットバッジ':'',held>=3?'🛡️ 最後まで3社以上キープ':''].filter(Boolean);
draw(`<h1>🏁 最終結果</h1><div class="card"><div class="big">${rank[0]}</div><h1 style="margin:0">${rank[1]}</h1>
<div class="row"><span>はじめの資産</span><b>${yen(st.start)}</b></div><div class="row"><span>最終資産</span><b>${yen(ta)}</b></div>
<div class="row"><span>損益</span><b class="${pr>0?'up':pr<0?'down':''}">${pr>=0?'+':''}${yen(pr)}（${pc.toFixed(1)}%）</b></div>
<div class="row"><span>もらった配当</span><b>${yen(st.divT)}</b></div>
<div class="row"><span>1社への集中度（平均）</span><b>${Math.round(avgTop*100)}%</b></div>
<div style="margin-top:8px">${badges.map(b=>`<span class="chip">${b}</span>`).join('')||'<span class="small">バッジは獲得なし。もう一度チャレンジ！</span>'}</div></div>
<div class="card"><h2>🔍 もし最初に10万円を1社だけに投資していたら？</h2>`+
single.map(x=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${x.s.e} ${x.s.name}</span><span>${yen(x.v)}</span></div><div class="bars"><i style="width:${x.v/mx*100}%;background:${x.s.c}"></i></div></div>`).join('')+
`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>⭐ あなた</span><span>${yen(ta)}</span></div><div class="bars"><i style="width:${ta/mx*100}%;background:var(--green)"></i></div></div>
<p class="small">1社だけだと大きく儲かる会社もあれば、大きく減る会社もあります。これが「リスクとリターン」です。</p></div>
<div class="card" style="background:#e9f3ff"><h2>✏️ ふり返り（ロイロノートに書こう）</h2><p class="lead">① 株価が上がった・下がった理由を、「需要」「供給」の言葉で説明しよう。<br>② 一番もうかった／損した判断はどれ？なぜ？<br>③ 株主になる良いところと、気をつけることは？</p>
<p class="small">この画面をスクリーンショットして提出しよう 📸</p></div>
<button class="btn" onclick="start()">もう一度あそぶ 🔄</button>`)}
function start(){init();intro(0)}
start();
</script></body></html>
